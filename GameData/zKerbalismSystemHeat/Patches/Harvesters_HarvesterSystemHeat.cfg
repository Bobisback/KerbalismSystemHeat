{
    MODULE
    {
        name = ModuleSystemHeat
        volume = #$/mass$
        moduleID = harvester
        iconName = Icon_Drill
    }
}

// Target: all parts that have a MODULE with title = Drill
// Requires Kerbalism + SystemHeat + KerbalismSystemHeat, runs late for stability.
// Replace all configured modules with our new module name
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Drill]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    @MODULE[Configure]
    {
        @SETUP,*
        {
            @MODULE,*
            {
                @type = HarvesterSystemHeat
            }
        }
    }
}

