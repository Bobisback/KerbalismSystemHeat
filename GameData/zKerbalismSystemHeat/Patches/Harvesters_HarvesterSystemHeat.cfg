// Add SystemHeat loop to any Drill part lacking ModuleSystemHeat
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Drill]],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    MODULE
    {
        name = ModuleSystemHeat
        volume = #$/mass$
        moduleID = harvester
        iconName = Icon_Drill
    }
}

// Add SystemHeat loop to any Pump part lacking ModuleSystemHeat
