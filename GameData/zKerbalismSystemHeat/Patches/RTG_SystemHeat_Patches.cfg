// ------------------------------------------------------------------------------
// Universal Storage: Radioisotope Thermoelectric Generator (USRTGWedge)
// Mod: UniversalStorage2
// Tech: Experimental Electrics [experimentalElectrics] — node8_experimentalElectrics → Tier ?
// EC/s capacity (kept): 0.75  ← ProcessController.capacity
// Heat coupling: systemPower = EC/s ÷ 0.09 = 0.75 ÷ 0.09 = 8.33333  ← capacity
// NEEDS: UniversalStorage2,Kerbalism,SystemHeat,zKerbalismSystemHeat
// ------------------------------------------------------------------------------
@PART[USRTGWedge]:NEEDS[UniversalStorage2,Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    // Remove legacy/duplicate RTG controllers and EC generators
    !MODULE[ProcessController]:HAS[#resource[_RTG]],* {}
    !MODULE[ProcessControllerSystemHeat]:HAS[#resource[_RTG]],* {}
    !MODULE[ModuleSystemHeatModule],* {}
    !MODULE[ModuleGenerator],* {}
    !MODULE[ModuleAlternator],* {}
    !MODULE[ModuleRadioisotopeGenerator],* {}

    // Install a single, SystemHeat-aware controller for RTG
    MODULE
    {
        name = ProcessControllerSystemHeat
        resource = _RTG
        title = RTG
        capacity = 0.75
        running = true
        toggle  = false

        // SystemHeat linkage and behavior
        systemHeatModuleID      = default
        shutdownTemperature     = 450
        systemOutletTemperature = 300
        systemPower             = 8.33333
        AutoShutdown            = true
        GeneratesHeat           = false

        // Standard SH efficiency curve
        systemEfficiency
        {
            key = 0     0.0
            key = 300   1.0
            key = 1000  1.0
            key = 1300  0.0
        }
    }

    // Single-pass update of ModuleSystemHeat (no separate creation or deletions)
    @MODULE[ModuleSystemHeat]
    {
        %volume    = #$/mass$
        %moduleID  = default
        %iconName  = Icon_Gears
    }
}

