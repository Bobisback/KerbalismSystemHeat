// ============================================================================
// FFT Regolith Scoops → SystemHeat Harvesters (Targeted, FINAL)
// Auto-generated from your MM cache to ensure exact resource coverage.
// - Converts each legacy ModuleSystemHeatHarvester on the two FFT scoops
//   into a HarvesterSystemHeat + matching Configure/SETUP.
// - min_abundance / rate are copied to match PART[RadialDrill] for the same resource.
// - shutdownTemperature, systemOutletTemperature, systemEfficiency, AutoShutdown,
//   and systemPower remain from the exact legacy module we replace (1:1).
// - Only removes the specific legacy module after replacement is added.
// - Loads late and only if the required mods are present.
// ============================================================================

@PART[fft-regolith-scoop-1]:FINAL:HAS[@MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]]]:NEEDS[FarFutureTechnologies,Kerbalism,SystemHeat,zKerbalismSystemHeat]
{
    %MODULE[Configure]
    {
        %name = Configure
        %title = Drill
        %slots = 1
        SETUP
        {
            name = LqdHe3 Extraction
            desc = Extract <b>LqdHe3</b> from the surface.
            MODULE
            {
                type = HarvesterSystemHeat
                id_field = resource
                id_value = LqdHe3
            }
            RESOURCE
            {
                name = LqdHe3
                amount = 0
                maxAmount = 50
            }
        }
    }

    +MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]]
    {
        @name = HarvesterSystemHeat
        %title    = LqdHe3 Extraction
        %resource = #$ResourceName$
        %type     = #$HarvesterType$
        %drill    = #$ImpactTransform$
        %length   = #$ImpactRange$

        %min_abundance = 0.02
        %rate          = 0.0025

        %ec_rate = #$INPUT_RESOURCE/Ratio$
        %systemHeatModuleID = harvester
        %GeneratesHeat = false

        !ImpactTransform  = DELETE
        !ImpactRange      = DELETE
        !HarvesterType    = DELETE
        !ResourceName     = DELETE
        !ConverterName    = DELETE
        !StartActionName  = DELETE
        !StopActionName   = DELETE
        !ToggleActionName = DELETE
        !INPUT_RESOURCE,* {}
    }

    !MODULE[ModuleSystemHeatHarvester]:HAS[#ResourceName[LqdHe3]] {}
}

