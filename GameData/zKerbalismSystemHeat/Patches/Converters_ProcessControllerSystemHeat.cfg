// UniversalStorage2 processors → SystemHeat + ProcessControllerSystemHeat
@PART[USElektron,USSabatier,USWaterPurifier]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,UniversalStorage2]:FINAL
{
    // Add or update the SystemHeat module
    %MODULE[ModuleSystemHeat]
    {
        %volume = #$/mass$
        %moduleID = isru
        %iconName = Icon_Radiator
        %ignoreTemperature = true
    }

    // Convert the Kerbalism ProcessController
    @MODULE[ProcessController]:HAS[#capacity[*]],*
    {
        // swap to our heat-aware controller
        @name = ProcessControllerSystemHeat

        // wire to this part's SystemHeat loop
        %systemHeatModuleID = isru

        // core SystemHeat params
        %shutdownTemperature = 800
        %systemOutletTemperature = 600

        // set base heat power equal to the Kerbalism process capacity
        %systemPower = #$capacity$

        // default behavior flags; Kerbalism handles resources, we handle heat
        %AutoShutdown = true
        %GeneratesHeat = false

        // define/replace the thermal efficiency curve
        !systemEfficiency {}
        systemEfficiency
        {
            key = 0    0.0
            key = 300  1.0
            key = 1000 1.0
            key = 1300 0.0
        }
    }
    
    // Add or update the planner module
    %MODULE[PlannerController]
    {
        %title = ModuleResourceConverter
        %considered = true
    }
}

// UniversalStorage2 Reliability
@PART[USElektron,USSabatier,USWaterPurifier]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,UniversalStorage2,FeatureReliability]:FINAL
{
    MODULE
    {
        name = Reliability
        type = ProcessControllerSystemHeat
        title = Chemical Plant
        repair = Engineer
        mtbf = 72576000
        extra_cost = 1.0
        extra_mass = 0.2
    }
}


// Normalize KPBS Configure title so it matches our "Chemical Plant" selectors
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Chemical?Production?Unit]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    @MODULE[Configure]:HAS[#title[Chemical?Production?Unit]],*
    {
        @title = Chemical Plant
    }
}

// Add SystemHeat module to any Chemical Plant part that doesn't already have one
// This should cover Rational Resources Parts and kerbalism chemical plant
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[ModuleSystemHeat]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    MODULE
    {
        name = ModuleSystemHeat
        // scale volume by the part's mass (can tweak later)
        volume = #$/mass$
        moduleID = isru
        iconName = Icon_Radiator
        ignoreTemperature = true
    }
}

// remove some resources that are not configured on the AirlineKuisine chemical plants. TODO add those resources instead of removing them
@PART[dsak_proc_3c,dsak_proc_c]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,AirlineKuisine]:FINAL
{
    !MODULE[*]:HAS[#resource[_WaterElectrolysisO2Priority]],* {}
    @MODULE[Configure],*
    {
        !SETUP:HAS[@MODULE:HAS[#id_value[_WaterElectrolysisO2Priority]]],* {}
    }
    
    !MODULE[*]:HAS[#resource[_WaterElectrolysisH2Priority]],* {}
    @MODULE[Configure],*
    {
        !SETUP:HAS[@MODULE:HAS[#id_value[_WaterElectrolysisH2Priority]]],* {}
    }
    
    !MODULE[*]:HAS[#resource[_SabatierH2OPriority]],* {}
    @MODULE[Configure],*
    {
        !SETUP:HAS[@MODULE:HAS[#id_value[_SabatierH2OPriority]]],* {}
    }
}

// Fixes an issue with a nested reliabilty module on both of these parts
@PART[dsak_proc_3c,dsak_proc_c]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,AirlineKuisine,FeatureReliability]:FINAL
{
    // Create/update a root-level Reliability using values from the nested one
    %MODULE[Reliability]
    {
        %type        = #$../MODULE[Configure]/MODULE[Reliability]/type$
        %title       = #$../MODULE[Configure]/MODULE[Reliability]/title$
        %repair      = #$../MODULE[Configure]/MODULE[Reliability]/repair$
        %mtbf        = #$../MODULE[Configure]/MODULE[Reliability]/mtbf$
        %extra_cost  = #$../MODULE[Configure]/MODULE[Reliability]/extra_cost$
        %extra_mass  = #$../MODULE[Configure]/MODULE[Reliability]/extra_mass$
    }

    // Remove the nested Reliability from Configure
    @MODULE[Configure]
    {
        !MODULE[Reliability],* {}
    }
}

// Target: all parts that have a MODULE with title = Chemical Plant
// Requires Kerbalism + SystemHeat + KerbalismSystemHeat, runs late for stability.
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Chemical?Plant]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    // Clean out any legacy bridge modules to prevent duplicates
    !MODULE[SystemHeatConverterKerbalism],* {}
    
    // Clean up any stray Reliability modules with ModuleResourceConverter
    !MODULE[Reliability]:HAS[#type[ModuleResourceConverter]],* {}

    // Convert every ProcessController on the part
    @MODULE[ProcessController]:HAS[#capacity[*]],*
    {
        // swap to our heat-aware controller
        @name = ProcessControllerSystemHeat

        // wire to this part's SystemHeat loop
        %systemHeatModuleID = isru

        // core SystemHeat params
        %shutdownTemperature = 800
        %systemOutletTemperature = 600

        // set base heat power equal to the Kerbalism process capacity
        %systemPower = #$capacity$

        // default behavior flags; Kerbalism handles resources, we handle heat
        %AutoShutdown = true
        %GeneratesHeat = false

        // define/replace the thermal efficiency curve
        !systemEfficiency {}
        systemEfficiency
        {
            key = 0    0.0
            key = 300  1.0
            key = 1000 1.0
            key = 1300 0.0
        }
    }
    
    @MODULE[Reliability]:HAS[#type[ProcessController],#title[Chemical?Plant]]
    {
        @type = ProcessControllerSystemHeat
    }
}

// Add Reliability module to any Chemical Plant part that doesn't already have one
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Chemical?Plant]],!MODULE[Reliability]:HAS[#type[ProcessControllerSystemHeat]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat,FeatureReliability]:FINAL
{
    MODULE
    {
        name = Reliability
        type = ProcessControllerSystemHeat
        title = Chemical Plant
        repair = Engineer
        mtbf = 72576000
        extra_cost = 1.0
        extra_mass = 0.2
    }
}

// Target: all parts that have a MODULE with title = Chemical Plant
// Requires Kerbalism + SystemHeat + KerbalismSystemHeat, runs late for stability.
// Replace all configured modules with our new module name
@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Chemical?Plant]]]:NEEDS[Kerbalism,SystemHeat,zKerbalismSystemHeat]:FINAL
{
    @MODULE[Configure]
    {
        @SETUP,*
        {
            @MODULE,*
            {
                @type = ProcessControllerSystemHeat
            }
        }
    }
}

