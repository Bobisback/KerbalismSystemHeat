// GameData/Z_KSH_Test/ISRU_ProcessControllerSystemHeat.cfg
@PART[ISRU]:NEEDS[Kerbalism,SystemHeat,KerbalismSystemHeat]:FINAL
{
  @MODULE[ProcessController],*
  {
    @name = ProcessControllerSystemHeat

    // Kerbalism fields (resource/title/capacity) remain as-is

    %AutoShutdown = true
    %GeneratesHeat = false
    %DefaultShutoffTemp = 0.8
    %UseSpecialistBonus = true
    %SpecialistEfficiencyFactor = 0.2
    %SpecialistBonusBase = 0.05
    %UseSpecialistHeatBonus = true
    %SpecialistHeatFactor = 0.1
    %ExperienceEffect = ConverterSkill
    %EfficiencyBonus = 1

    // Ensure each ProcessControllerSystemHeat is wired to the ISRU SystemHeat loop
    %systemHeatModuleID = isru

    %shutdownTemperature = 800
    %systemOutletTemperature = 600
    %systemPower = 27

    !systemEfficiency {}
    systemEfficiency
    {
      key = 0    0.0
      key = 300  1.0
      key = 1000 1.0
      key = 1300 0.0
    }
  }
}
